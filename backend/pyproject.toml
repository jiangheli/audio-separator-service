[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stemflow-video-bgm-remover"
version = "1.0.0"
description = "Windows Server unattended video BGM removal powered by python-audio-separator"
requires-python = ">=3.10,<3.13"
dependencies = [
  "audio-separator>=0.44.5,<0.45",
  "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
cpu = [
  "imageio-ffmpeg>=0.6,<1",
  "onnxruntime>=1.17",
]
gpu = [
  "imageio-ffmpeg>=0.6,<1",
  "onnxruntime-gpu>=1.17",
]
windows = [
  "imageio-ffmpeg>=0.6,<1",
  "onnxruntime>=1.17",
]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
stemflow = "app.cli.main:main"
stemflow-video = "app.cli.main:main"
audio-separator-service = "app.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
