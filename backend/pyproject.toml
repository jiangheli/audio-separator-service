[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-separator-service"
version = "0.2.0"
description = "Local-first web, worker and CLI service powered by python-audio-separator"
requires-python = ">=3.10"
dependencies = [
  "audio-separator>=0.44.5,<0.45",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.34,<1",
  "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.17"]
gpu = ["onnxruntime-gpu>=1.17"]
windows = [
  "imageio-ffmpeg>=0.6,<1",
  "onnxruntime>=1.17",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
audio-separator-service = "app.cli.main:main"
stemflow = "app.cli.main:main"
audio-separator-worker = "app.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
