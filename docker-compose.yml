name: audio-separator-service

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment:
    AUDIO_SERVICE_DATA_DIR: /data
    AUDIO_SERVICE_DATABASE_PATH: /data/tasks.db
    AUDIO_SERVICE_MODEL_DIR: /data/models
    AUDIO_SERVICE_TASK_MODE: redis
    AUDIO_SERVICE_REDIS_URL: redis://redis:6379/0
    AUDIO_SERVICE_WORKER_CONCURRENCY: ${AUDIO_SERVICE_WORKER_CONCURRENCY:-2}
    AUDIO_SERVICE_AUTOMATION_ENABLED: ${AUDIO_SERVICE_AUTOMATION_ENABLED:-false}
    AUDIO_SERVICE_AUTOMATION_INPUT_DIR: ${AUDIO_SERVICE_AUTOMATION_INPUT_DIR:-/input}
    AUDIO_SERVICE_AUTOMATION_OUTPUT_DIR: ${AUDIO_SERVICE_AUTOMATION_OUTPUT_DIR:-/output}
    AUDIO_SERVICE_AUTOMATION_SCHEDULE_MODE: ${AUDIO_SERVICE_AUTOMATION_SCHEDULE_MODE:-daily}
    AUDIO_SERVICE_AUTOMATION_DAILY_TIME: ${AUDIO_SERVICE_AUTOMATION_DAILY_TIME:-00:00}
    AUDIO_SERVICE_AUTOMATION_TIMEZONE: ${AUDIO_SERVICE_AUTOMATION_TIMEZONE:-Asia/Shanghai}
    AUDIO_SERVICE_AUTOMATION_INTERVAL_MINUTES: ${AUDIO_SERVICE_AUTOMATION_INTERVAL_MINUTES:-5}
    AUDIO_SERVICE_AUTOMATION_STABLE_SECONDS: ${AUDIO_SERVICE_AUTOMATION_STABLE_SECONDS:-60}
    AUDIO_SERVICE_AUTOMATION_MAX_RETRIES: ${AUDIO_SERVICE_AUTOMATION_MAX_RETRIES:-3}
  volumes:
    - type: bind
      source: ./data
      target: /data
    - type: bind
      source: ${AUDIO_SERVICE_HOST_INPUT:-./data/input}
      target: /input
      read_only: true
    - type: bind
      source: ${AUDIO_SERVICE_HOST_OUTPUT:-./data/output}
      target: /output
  restart: unless-stopped

services:
  frontend:
    build: ./frontend
    ports:
      - "${AUDIO_SERVICE_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    <<: *backend-common
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${AUDIO_SERVICE_API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend-common
    command: ["python", "-m", "app.worker.main"]
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
